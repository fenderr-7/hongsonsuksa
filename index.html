<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;background:linear-gradient(180deg,#f0f9ff 0,#f8fafc 28%,#f8fafc 100%);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-bottom:1px solid rgba(226,232,240,.8)}.topbar-in{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;object-fit:cover;background:#e0f2fe;border:1px solid #bae6fd}.brand h1{font-size:19px;margin:0;line-height:1.15}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;gap:8px}.icon-btn,.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;color:#334155}.icon-btn:hover,.ghost:hover{background:#f8fafc}.main{max-width:1200px;margin:auto;padding:18px 16px 96px}.page{animation:up .25s ease}.hero{background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;border-radius:28px;padding:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-100px;background:rgba(255,255,255,.12)}.hero h2{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#e0f2fe;max-width:670px;line-height:1.7}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:20px;position:relative;z-index:1}.grid{display:grid;gap:14px}.roles{grid-template-columns:repeat(4,1fr);margin-top:18px}.role{background:#fff;border:1px solid rgba(255,255,255,.55);border-radius:18px;padding:20px;text-align:left;box-shadow:0 8px 22px rgba(2,132,199,.14);transition:.2s}.role:hover{transform:translateY(-2px)}.role .ico{font-size:28px}.role strong{display:block;font-size:16px;margin-top:8px}.role span{font-size:12px;color:#64748b}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.section-title h3{margin:0;font-size:20px}.cards{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(15,23,42,.04);padding:18px}.stat{display:flex;align-items:center;gap:12px}.stat .ico{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#e0f2fe;font-size:23px}.stat b{display:block;font-size:28px}.stat small{color:var(--muted)}.quick{grid-template-columns:repeat(4,1fr)}.quick button{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;box-shadow:0 5px 16px rgba(15,23,42,.04)}.quick button:hover{border-color:#7dd3fc;background:#f0f9ff}.quick b{display:block;margin-top:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}.p-blue{background:#e0f2fe;color:#075985}.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#fee2e2;color:#991b1b}.form{display:grid;gap:12px}.two{grid-template-columns:repeat(2,1fr)}label{font-size:12px;color:#475569;font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#38bdf8;box-shadow:0 0 0 3px #e0f2fe}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:600}.btn:hover{background:#0369a1}.btn.secondary{background:#0f172a}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.light{background:#e0f2fe;color:#075985}.btn:disabled{opacity:.55;cursor:not-allowed}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-in{max-width:800px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#64748b;padding:8px 12px;border-radius:12px;font-size:11px;min-width:70px}.nav button.active{color:#0369a1;background:#e0f2fe;font-weight:700}.list{display:grid;gap:9px}.list-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.list-main{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:13px}.table th{background:#f8fafc;color:#475569;font-size:12px}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.center{text-align:center}.empty{padding:32px 10px;text-align:center;color:#94a3b8}.toast{position:fixed;top:72px;right:16px;z-index:50;max-width:340px;background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);display:none}.modal{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:end;justify-content:center;padding:12px}.modal.open{display:flex}.modal-box{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo-grid img{width:100%;max-height:380px;object-fit:contain;background:#f8fafc;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}.detail-photo{width:100%;max-height:420px;object-fit:contain;background:#f8fafc;border-radius:16px;border:1px solid var(--line);cursor:zoom-in}.login-box{max-width:520px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}.student-head{display:flex;align-items:center;gap:14px}.student-avatar{width:72px;height:72px;border-radius:18px;object-fit:cover;background:#e0f2fe;border:1px solid var(--line)}.badge-big{font-size:22px;font-weight:700}.notice{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:12px;font-size:12px;color:#475569;line-height:1.7}@keyframes up{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:900px){.roles,.cards,.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.topbar-in,.main{padding-left:12px;padding-right:12px}.brand h1{font-size:16px}.brand p{display:none}.hero{padding:20px;border-radius:22px}.hero h2{font-size:25px}.hero-row{display:block}.roles,.cards,.quick,.two{grid-template-columns:1fr}.card{padding:15px}.nav button{min-width:56px;padding:7px 4px}.toolbar>*{width:100%}.table{min-width:680px}.modal{padding:0}.modal-box{border-radius:24px 24px 0 0}}

<script>
const SUPABASE_URL = "https://fgpuhmqcpmtugyczulop.supabase.co";
const SUPABASE_KEY = "sb_publishable_4gpKvuaXsD82NpG4j6cv8A_MQlkS31U";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const state = { role:null, student:null, page:"home", cache:{students:[],trips:[],leaves:[]} };

const $ = id => document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg,ok=true){const t=$("toast");t.textContent=msg;t.style.background=ok?"#0f172a":"#991b1b";t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
function fmtDate(v){return v?new Intl.DateTimeFormat("th-TH",{dateStyle:"medium"}).format(new Date(v)):"-"}
function fmtDT(v){return v?new Intl.DateTimeFormat("th-TH",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v)):"-"}
function today(){return new Date().toISOString().slice(0,10)}
function publicUrl(bucket,path){return path?sb.storage.from(bucket).getPublicUrl(path).data.publicUrl:""}
function statusPill(s){
  const c=s==="อนุมัติ"||s==="กลับเข้าหอ"||s==="กลับแล้ว"?"p-ok":s==="ไม่อนุมัติ"||s==="ยกเลิก"||s==="ยังไม่กลับ"?"p-bad":"p-warn";
  return '<span class="pill '+c+'">'+esc(s)+'</span>';
}
function logoHtml(cls="logo"){
 return '<img class="'+cls+'" src="https://hongson.ac.th/hsweb/wp-content/uploads/2024/07/image.png" alt="โลโก้โรงเรียน" onerror="this.onerror=null;this.src=\'favicon.svg\'">';
}
function shell(title,subtitle){
 return '<div class="topbar"><div class="topbar-in"><div class="brand">'+logoHtml()+'<div><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p></div></div><div class="top-actions"><button class="ghost" onclick="exitRole()">← หน้าหลัก</button></div></div></div><main class="main" id="content"></main>'+nav();
}
function nav(){
 if(!state.role)return "";
 const items=state.role==="นักเรียน"?[
   ["home","🏠","หน้าหลัก"],["trip","🏡","กลับบ้าน"],["leave","📝","พัก/ลา"],["history","🕘","ประวัติ"]
 ]:state.role==="ผู้ปกครอง"?[
   ["home","🏠","หน้าแรก"],["status","📍","สถานะ"],["history","🕘","ประวัติ"]
 ]:[
   ["home","🏠","หน้าหลัก"],["trips","🏡","กลับบ้าน"],["leaves","📝","พัก/ลา"],["students","👥","นักเรียน"]
 ];
 return '<div class="nav"><div class="nav-in">'+items.map(x=>'<button class="'+(state.page===x[0]?"active":"")+'" onclick="route(\''+x[0]+'\')"><div style="font-size:18px">'+x[1]+'</div>'+x[2]+'</button>').join("")+'</div></div>'
}
async function queryAll(){
 const [st,tr,lr]=await Promise.all([
  sb.from("students").select("*").eq("active",true).order("level").order("room").order("student_code"),
  sb.from("home_trips").select("*,students(id,student_code,full_name,level,room,photo_path)").order("leave_at",{ascending:false}).limit(300),
  sb.from("leave_requests").select("*,students(id,student_code,full_name,level,room,photo_path)").order("created_at",{ascending:false}).limit(300)
 ]);
 if(st.error) throw st.error;if(tr.error) throw tr.error;if(lr.error) throw lr.error;
 state.cache={students:st.data||[],trips:tr.data||[],leaves:lr.data||[]}; return state.cache;
}
async function getStudentByCode(code){
 const {data,error}=await sb.from("students").select("*").eq("student_code",code).eq("active",true).maybeSingle(); if(error)throw error; return data;
}
function start(){
 state.role=null; state.page="home"; renderRole();
}
function renderRole(){
 $("app").innerHTML='<main class="main"><div class="login-box"><div class="center">'+logoHtml("logo")+"<h2 style='margin:12px 0 5px'>Homecoming</h2><p class='muted'>ระบบจัดการการกลับบ้าน การพัก/ลา และการกลับเข้าหอพักนักเรียน</p></div><div class='notice' style='margin:18px 0'>เลือกประเภทผู้ใช้งานเพื่อเข้าสู่เมนูที่เกี่ยวข้อง ระบบรุ่นนี้ยังไม่บังคับรหัสผ่าน</div><div class='grid' style='grid-template-columns:repeat(2,1fr)'>"+[
 ["นักเรียน","🎓","บันทึกกลับบ้าน / กลับเข้าหอ / แจ้งพัก-ลา"],
 ["ผู้ปกครอง","👨‍👩‍👧","ติดตามสถานะและประวัติของนักเรียน"],
 ["ครู","👩‍🏫","ตรวจสอบรายการ อนุมัติพัก-ลา และดูนักเรียน"],
 ["ผู้บริหาร","📊","ภาพรวมสถิติ รายงาน และข้อมูลทั้งระบบ"]
 ].map(x=>'<button class="role" onclick="chooseRole(\''+x[0]+'\')"><div class="ico">'+x[1]+'</div><strong>'+x[0]+'</strong><span>'+x[2]+'</span></button>').join("")+"</div><p class='muted center' style='margin-top:20px'>โรงเรียนห้องสอนศึกษา ในพระอุปถัมภ์ฯ</p></div></main>";
}
function chooseRole(role){
 state.role=role;
 state.student=null;
 if(role==="ผู้ปกครอง"){ renderIdentity(); }
 else { state.page="home"; render(); }
}
function renderIdentity(){
 $("app").innerHTML='<main class="main"><div class="login-box"><div class="student-head">'+logoHtml("student-avatar")+'<div><div class="muted">เข้าสู่ระบบแบบเลือกนักเรียน</div><div class="badge-big">'+esc(state.role)+'</div></div></div><div class="form" style="margin-top:18px"><label>รหัสนักเรียน</label><input id="identityCode" placeholder="เช่น STD-001" autocomplete="off"><button class="btn" onclick="identitySubmit()">เข้าสู่ระบบ</button><button class="btn light" onclick="start()">← เปลี่ยนประเภทผู้ใช้งาน</button></div><div class="notice" style="margin-top:14px">ใช้รหัสนักเรียนเพื่อเปิดข้อมูลของนักเรียนคนนั้น ระบบนี้เป็นเวอร์ชันใช้งานภายในและยังไม่ได้เปิด Auth/PIN</div></div></main>';
 $("identityCode").focus();
}
async function identitySubmit(){
 try{const s=await getStudentByCode($("identityCode").value.trim()); if(!s)return toast("ไม่พบรหัสนักเรียน",false); state.student=s; state.page="home"; render();}catch(e){toast("เชื่อมต่อข้อมูลไม่สำเร็จ: "+e.message,false)}
}
function goHome(){state.page="home";render()}
function exitRole(){closeModal();state.role=null;state.student=null;state.page="home";renderRole()}
async function render(){
 try{
  if(!state.cache.students.length) await queryAll();
  let title=state.role==="นักเรียน"?"Homecoming · นักเรียน":state.role==="ผู้ปกครอง"?"Homecoming · ผู้ปกครอง":"Homecoming · "+state.role;
  $("app").innerHTML=shell(title,"โรงเรียนห้องสอนศึกษา ในพระอุปถัมภ์ฯ");
  if(state.role==="นักเรียน") renderStudent(); else if(state.role==="ผู้ปกครอง") renderParent(); else renderStaff();
 }catch(e){$("app").innerHTML='<main class="main"><div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="render()">ลองใหม่</button></div></main>'}
}
function renderStudentPicker(){
 const students=state.cache.students;
 $("content").innerHTML='<div class="hero"><div class="hero-row"><div><p style="color:#bae6fd">โหมดนักเรียน</p><h2>แดชบอร์ดนักเรียน</h2><p>ไม่ต้องเข้าสู่ระบบ เลือกชื่อนักเรียนของตนเองเพื่อเริ่มใช้งาน</p></div><div class="pill p-blue">'+students.length+' คน</div></div></div><div class="section-title"><h3>เลือกข้อมูลของตนเอง</h3></div><div class="card"><div class="form"><label>ค้นหาชื่อ / รหัสนักเรียน</label><input id="studentPickerSearch" oninput="filterStudentPicker()" placeholder="พิมพ์ชื่อหรือ STD-001"><select id="studentPicker" size="8" style="min-height:250px" onchange="selectStudentFromPicker()"></select><button class="btn" onclick="confirmStudentPicker()">เข้าสู่แดชบอร์ดนักเรียน</button></div><div class="notice" style="margin-top:14px">ไม่มีรหัสผ่านหรือ OTP นักเรียนเพียงเลือกชื่อของตนเองเพื่อเปิดข้อมูลและทำรายการ</div></div>';
 filterStudentPicker();
}
function filterStudentPicker(){
 const el=$("studentPicker"); if(!el)return;
 const q=($("studentPickerSearch")?.value||"").trim().toLowerCase();
 const rows=state.cache.students.filter(s=>(s.full_name+" "+s.student_code+" "+s.level+" "+s.room).toLowerCase().includes(q));
 el.innerHTML=rows.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.student_code)+' · '+esc(s.full_name)+' · '+esc(s.level)+' / ห้อง '+esc(s.room)+'</option>').join("") || '<option value="">ไม่พบข้อมูล</option>';
}
function selectStudentFromPicker(){ }
function confirmStudentPicker(){
 const id=$("studentPicker")?.value;
 const s=state.cache.students.find(x=>x.id===id);
 if(!s)return toast("กรุณาเลือกนักเรียนก่อน",false);
 state.student=s; state.page="home"; render();
}

function renderStudent(){
 if(!state.student){ renderStudentPicker(); return; }
 const s=state.student; const trips=state.cache.trips.filter(x=>x.student_id===s.id); const leaves=state.cache.leaves.filter(x=>x.student_id===s.id);
 if(state.page==="home"){
  const latest=trips[0]; const pending=leaves.find(x=>x.status==="รอตรวจสอบ");
  $("content").innerHTML='<div class="hero"><div class="hero-row"><div><p style="color:#bae6fd">ยินดีต้อนรับ</p><h2>'+esc(s.full_name)+'</h2><p>ชั้น '+esc(s.level)+' · ห้อง '+esc(s.room)+' · '+esc(s.student_code)+'</p></div><div>'+statusPill(latest?(latest.return_at?"กลับเข้าหอแล้ว":"ยังไม่กลับ"):"ยังไม่มีรายการวันนี้")+'</div></div></div><div class="section-title"><h3>เมนูด่วน</h3></div><div class="grid quick"><button onclick="leaveHomeForm()">🏡<b>แจ้งกลับบ้าน</b><span class="muted">บันทึกเวลาออกจากหอ</span></button><button onclick="returnForm()">↩️<b>กลับเข้าหอ</b><span class="muted">บันทึกเวลากลับและรูปถ่าย</span></button><button onclick="route(\'leave\')">📝<b>แจ้งพัก / ลา</b><span class="muted">'+(pending?"มีรายการรอตรวจสอบ":"ส่งคำขอให้ครูตรวจ")+'</span></button><button onclick="route(\'history\')">🕘<b>ดูประวัติ</b><span class="muted">'+trips.length+' รายการกลับบ้าน · '+leaves.length+' รายการพัก/ลา</span></button></div><div class="section-title"><h3>สถานะล่าสุด</h3></div><div class="card"><div class="student-head">'+photoForStudent(s) + '<div><div class="badge-big">'+esc(s.full_name)+'</div><div class="muted">'+esc(s.level)+' / ห้อง '+esc(s.room)+'</div></div></div><div class="notice" style="margin-top:14px">'+(latest?"รายการล่าสุด: "+fmtDT(latest.leave_at)+" · "+(latest.return_at?"กลับ "+fmtDT(latest.return_at):"ยังไม่บันทึกการกลับเข้าหอ"):"ยังไม่มีรายการกลับบ้าน")+'</div></div>';
 } else if(state.page==="trip") renderTripStudent(trips);
 else if(state.page==="leave") renderLeaveStudent(leaves);
 else renderHistoryStudent(trips,leaves);
}
function photoForStudent(s){return s.photo_path?'<img class="student-avatar" src="'+esc(publicUrl("student-photos",s.photo_path))+'" alt="">':'<div class="student-avatar" style="display:grid;place-items:center;font-size:30px">🎓</div>'}
function renderTripStudent(trips){
 const open=trips.find(x=>x.home_date===today()&&!x.return_at);

async function createTrip(){
 try{
  const exists=state.cache.trips.find(x=>x.student_id===state.student.id&&x.home_date===today()&&!x.return_at);
  if(exists){closeModal();return toast("วันนี้มีรายการกลับบ้านอยู่แล้ว",false);}
  const senderName=$("senderName")?.value.trim()||"";
  const senderPhone=$("senderPhone")?.value.trim()||"";
  const senderRelation=$("senderRelation")?.value||"";
  if(!senderName||!senderPhone||!senderRelation)return toast("กรุณากรอกข้อมูลคนมาส่งให้ครบ",false);
  const file=$("leavePhoto")?.files[0]; let path=null;
  if(file) path=await upload(file,"trip-photos",state.student.student_code||state.student.id);
  const payload={student_id:state.student.id,home_date:today(),leave_at:new Date().toISOString(),sender_name:senderName,sender_phone:senderPhone,sender_relation:senderRelation};
  if(path){payload.leave_evidence_photo_path=path;payload.leave_photo_path=path;}
  const {data,error}=await sb.from("home_trips").insert(payload).select().single(); if(error)throw error;
  state.cache.trips.unshift({...data,students:state.student});
  closeModal(); toast("บันทึกการกลับบ้านและข้อมูลคนมาส่งแล้ว"); render();
 }catch(e){toast("บันทึกไม่สำเร็จ: "+e.message,false)}
}

function closeModal(){document.querySelectorAll(".modal").forEach(x=>x.remove())}
async function upload(file,bucket,prefix){
 if(!file)return null;
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase(); const path=prefix+"/"+crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"}); if(error)throw error; return path;
}
async function saveReturn(id){
 try{
  const file=$("returnPhoto").files[0]; let path=null; if(file)path=await upload(file,"trip-photos",state.student.student_code||state.student.id);
  const patch={return_at:new Date().toISOString()}; if(path)patch.return_photo_path=path;
  const {data,error}=await sb.from("home_trips").update(patch).eq("id",id).select().single(); if(error)throw error;
  const idx=state.cache.trips.findIndex(x=>x.id===id); if(idx>=0)state.cache.trips[idx]={...state.cache.trips[idx],...data}; closeModal(); toast("บันทึกกลับเข้าหอแล้ว"); render();
 }catch(e){toast("บันทึกกลับเข้าหอไม่สำเร็จ: "+e.message,false)}
}

function renderStaffLeaves(){
 const rows=state.cache.leaves;
 $("content").innerHTML='<div class="section-title"><h3>📝 ตรวจสอบพัก / ลา</h3><button class="ghost" onclick="queryAll().then(render)">รีเฟรช</button></div><div class="table-wrap"><table class="table"><thead><tr><th>นักเรียน</th><th>ประเภท</th><th>ช่วงเวลา</th><th>เหตุผล</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>'+ (rows.length?rows.map(x=>'<tr><td><b>'+esc(x.students?.full_name||"-")+'</b><div class="muted">'+esc(x.students?.student_code||"")+'</div></td><td>'+esc(x.leave_type)+'</td><td>'+fmtDT(x.start_at)+'<br>'+fmtDT(x.expected_return_at)+'</td><td>'+esc(x.reason||"-")+'</td><td>'+statusPill(x.status)+'</td><td>'+ (x.status==="รอตรวจสอบ"?'<button class="btn ok" onclick="reviewLeave(\''+x.id+'\',\'อนุมัติ\')">อนุมัติ</button> <button class="btn bad" onclick="reviewLeave(\''+x.id+'\',\'ไม่อนุมัติ\')">ไม่อนุมัติ</button>':'<button class="ghost" onclick="reviewLeave(\''+x.id+'\',\'ดู\')">ดูรายละเอียด</button>')+'</td></tr>').join(""):'<tr><td colspan="6" class="center">ยังไม่มีคำขอ</td></tr>')+'</tbody></table></div>';
}
function reviewLeave(id,action){
 const x=state.cache.leaves.find(v=>v.id===id);if(!x)return;
 if(action==="ดู"){alert("สถานะ: "+x.status+"\\nหมายเหตุครู: "+(x.teacher_note||"-"));return}
 const note=prompt("บันทึกหมายเหตุถึงนักเรียน/ผู้ปกครอง (เว้นว่างได้)",""); if(note===null)return;
 sb.from("leave_requests").update({status:action,teacher_note:note.trim()}).eq("id",id).select().single().then(({data,error})=>{
  if(error)return toast("อัปเดตไม่สำเร็จ: "+error.message,false); Object.assign(x,data); toast("อัปเดตคำขอแล้ว"); render();
 });
}
function renderStudents(){
 const st=state.cache.students;
 $("content").innerHTML='<div class="section-title"><h3>👥 นักเรียน</h3><button class="ghost" onclick="queryAll().then(render)">รีเฟรช</button></div><div class="card"><div class="form two"><input id="stuSearch" oninput="filterStudents()" placeholder="ค้นหาชื่อหรือรหัสนักเรียน"><select id="levelFilter" onchange="filterStudents()"><option value="">ทุกระดับชั้น</option>'+[...new Set(st.map(x=>x.level))].map(v=>'<option>'+esc(v)+'</option>').join("")+'</select></div></div><div class="card table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>รูป</th><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชั้น</th><th>ห้อง</th><th>จัดการ</th></tr></thead><tbody id="studentRows"></tbody></table></div>'; filterStudents();
}
function filterStudents(){
 const q=($("stuSearch")?.value||"").trim().toLowerCase(), lv=$("levelFilter")?.value||"";
 const rows=state.cache.students.filter(s=>(!q||(s.full_name+" "+s.student_code).toLowerCase().includes(q))&&(!lv||s.level===lv));
 $("studentRows").innerHTML=rows.map(s=>'<tr><td>'+(s.photo_path?'<img class="thumb" src="'+esc(publicUrl("student-photos",s.photo_path))+'">':'🎓')+'</td><td>'+esc(s.student_code)+'</td><td><b>'+esc(s.full_name)+'</b></td><td>'+esc(s.level)+'</td><td>'+esc(s.room)+'</td><td><button class="ghost" onclick="viewStudent(\''+s.id+'\')">ดูข้อมูล</button></td></tr>').join("")||'<tr><td colspan="6" class="center">ไม่พบข้อมูล</td></tr>';
}
function viewStudent(id){
 const s=state.cache.students.find(x=>x.id===id), trips=state.cache.trips.filter(x=>x.student_id===id).slice(0,10), leaves=state.cache.leaves.filter(x=>x.student_id===id).slice(0,10);
 $("app").insertAdjacentHTML("beforeend",'<div class="modal open"><div class="modal-box"><div class="modal-head"><h3>ข้อมูลนักเรียน</h3><button class="ghost" onclick="closeModal()">ปิด</button></div><div class="student-head">'+photoForStudent(s)+'<div><div class="badge-big">'+esc(s.full_name)+'</div><div class="muted">'+esc(s.student_code)+' · '+esc(s.level)+' / ห้อง '+esc(s.room)+'</div></div></div><div class="section-title"><h3>กลับบ้านล่าสุด</h3></div>'+renderTripList(trips)+'<div class="section-title"><h3>พัก / ลา</h3></div>'+renderLeaves(leaves)+'</div></div>');
}
function renderExecutive(){
 const st=state.cache.students,tr=state.cache.trips,lr=state.cache.leaves; const tp=tr.filter(x=>x.home_date===today()),out=tp.filter(x=>!x.return_at).length,ret=tp.filter(x=>x.return_at).length,p=lr.filter(x=>x.status==="รอตรวจสอบ").length;
 $("content").innerHTML='<div class="hero"><div class="hero-row"><div><p style="color:#bae6fd">ผู้บริหาร</p><h2>รายงานภาพรวม Homecoming</h2><p>ข้อมูลปัจจุบันจากฐานข้อมูล Supabase</p></div><button class="btn light" onclick="exportCSV()">⬇️ Export CSV</button></div></div><div class="section-title"><h3>สถิติ</h3></div><div class="grid cards"><div class="card stat"><div class="ico">👥</div><div><b>'+st.length+'</b><small>นักเรียน</small></div></div><div class="card stat"><div class="ico">🏡</div><div><b>'+tp.length+'</b><small>กลับบ้านวันนี้</small></div></div><div class="card stat"><div class="ico">✅</div><div><b>'+ret+'</b><small>กลับเข้าหอแล้ว</small></div></div><div class="card stat"><div class="ico">⚠️</div><div><b>'+out+'</b><small>ยังไม่กลับ</small></div></div></div><div class="section-title"><h3>คำขอพัก / ลา</h3></div><div class="card"><b style="font-size:30px">'+p+'</b><div class="muted">รอตรวจสอบ</div></div><div class="section-title"><h3>การทำงาน</h3></div><div class="grid quick"><button onclick="route(\'trips\')">🏡<b>รายการกลับบ้าน</b></button><button onclick="route(\'leaves\')">📝<b>คำขอพัก/ลา</b></button><button onclick="route(\'students\')">👥<b>ข้อมูลนักเรียน</b></button><button onclick="exportCSV()">📊<b>รายงาน CSV</b></button></div>';
}
function exportCSV(){
 const rows=[["วันที่","รหัสนักเรียน","ชื่อ-สกุล","ชั้น","ห้อง","ออกจากหอ","กลับเข้าหอ","สถานะ","คนมาส่ง/ผู้รับ","เบอร์โทร","ความเกี่ยวข้อง"]];
 state.cache.trips.forEach(t=>rows.push([t.home_date,t.students?.student_code||"",t.students?.full_name||"",t.students?.level||"",t.students?.room||"",t.leave_at||"",t.return_at||"",t.return_at?"กลับแล้ว":"ยังไม่กลับ",t.sender_name||"",t.sender_phone||"",t.sender_relation||""]));
 const csv="\\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="homecoming-report-"+today()+".csv";a.click();URL.revokeObjectURL(a.href);toast("ส่งออกรายงานแล้ว");
}
function route(p){state.page=p;render()}
window.addEventListener("error",e=>console.error(e));
start();
</script>
</body>
</html>
