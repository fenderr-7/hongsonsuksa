ck;font-size:16px;margin-top:8px}.role span{font-size:12px;color:#64748b}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.section-title h3{margin:0;font-size:20px}.cards{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px rgba(15,23,42,.04);padding:18px}.stat{display:flex;align-items:center;gap:12px}.stat .ico{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#e0f2fe;font-size:23px}.stat b{display:block;font-size:28px}.stat small{color:var(--muted)}.quick{grid-template-columns:repeat(4,1fr)}.quick button{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;box-shadow:0 5px 16px rgba(15,23,42,.04)}.quick button:hover{border-color:#86efac;background:#f0fdf4}.quick b{display:block;margin-top:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}.p-blue{background:#e0f2fe;color:#166534}.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#fee2e2;color:#991b1b}.form{display:grid;gap:12px}.two{grid-template-columns:repeat(2,1fr)}label{font-size:12px;color:#475569;font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#4ade80;box-shadow:0 0 0 3px #dcfce7}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:600}.btn:hover{background:#15803d}.btn.secondary{background:#0f172a}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.light{background:#e0f2fe;color:#166534}.btn:disabled{opacity:.55;cursor:not-allowed}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-in{max-width:800px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#64748b;padding:8px 12px;border-radius:12px;font-size:11px;min-width:70px}.nav button.active{color:#166534;background:#e0f2fe;font-weight:700}.list{display:grid;gap:9px}.list-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.list-main{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #f1f5f9;text-align:left;font-size:13px}.table th{background:#f8fafc;color:#475569;font-size:12px}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.center{text-align:center}.empty{padding:32px 10px;text-align:center;color:#94a3b8}.toast{position:fixed;top:72px;right:16px;z-index:50;max-width:340px;background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);display:none}.modal{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:end;justify-content:center;padding:12px}.modal.open{display:flex}.modal-box{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo-grid img{width:100%;max-height:380px;object-fit:contain;background:#f8fafc;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}.detail-photo{width:100%;max-height:420px;object-fit:contain;background:#f8fafc;border-radius:16px;border:1px solid var(--line);cursor:zoom-in}.staff-thumb{width:68px;height:68px;border-radius:14px;object-fit:cover;border:2px solid #bbf7d0;cursor:zoom-in;background:#f0fdf4}.staff-thumb.placeholder{display:grid;place-items:center;font-size:28px;color:#166534}.thumb-label{font-size:11px;color:#64748b;margin-bottom:4px}.login-box{max-width:520px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}.student-head{display:flex;align-items:center;gap:14px}.student-avatar{width:72px;height:72px;border-radius:18px;object-fit:cover;background:#e0f2fe;border:1px solid var(--line)}.badge-big{font-size:22px;font-weight:700}.notice{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:12px;font-size:12px;color:#475569;line-height:1.7}@keyframes up{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:900px){.roles,.cards,.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.topbar-in,.main{padding-left:12px;padding-right:12px}.brand h1{font-size:16px}.brand p{display:none}.hero{padding:20px;border-radius:22px}.hero h2{font-size:25px}.hero-row{display:block}.roles,.cards,.quick,.two{grid-template-columns:1fr}.card{padding:15px}.nav button{min-width:56px;padding:7px 4px}.toolbar>*{width:100%}.table{min-width:680px}.modal{padding:0}.modal-box{border-radius:24px 24px 0 0}}

<script>
const SUPABASE_URL = "https://fgpuhmqcpmtugyczulop.supabase.co";
const SUPABASE_KEY = "sb_publishable_4gpKvuaXsD82NpG4j6cv8A_MQlkS31U";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const state = { role:null, student:null, page:"home", tripDate:today(), tripRows:[], cache:{students:[],trips:[],leaves:[]} };

const $ = id => document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg,ok=true){const t=$("toast");t.textContent=msg;t.style.background=ok?"#0f172a":"#991b1b";t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
function fmtDate(v){return v?new Intl.DateTimeFormat("th-TH",{dateStyle:"medium"}).format(new Date(v)):"-"}
function fmtDT(v){return v?new Intl.DateTimeFormat("th-TH",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v)):"-"}
function today(){return new Date().toISOString().slice(0,10)}
function publicUrl(bucket,path){return path?sb.storage.from(bucket).getPublicUrl(path).data.publicUrl:""}
function statusPill(s){
  const c=s==="อนุมัติ"||s==="กลับเข้าหอ"||s==="กลับแล้ว"?"p-ok":s==="ไม่อนุมัติ"||s==="ยกเลิก"||s==="ยังไม่กลับ"?"p-bad":"p-warn";
  return '<span class="pill '+c+'">'+esc(s)+'</span>';
}
function logoHtml(cls="logo"){
 return '<img class="'+cls+'" src="https://hongson.ac.th/hsweb/wp-content/uploads/2024/07/image.png" alt="โลโก้โรงเรียน" onerror="this.onerror=null;this.src=\'favicon.svg\'">';
}
function shell(title,subtitle){
 return '<div class="topbar"><div class="topbar-in"><div class="brand">'+logoHtml()+'<div><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p></div></div><div class="top-actions"><button class="ghost" onclick="exitRole()">← หน้าหลัก</button></div></div></div><main class="main" id="content"></main>'+nav();
}
function nav(){
 if(!state.role)return "";
 const items=state.role==="นักเรียน"?[
   ["home","🏠","หน้าหลัก"],["trip","🏡","กลับบ้าน"],["leave","📝","พัก/ลา"],["history","🕘","ประวัติ"]
 ]:state.role==="ผู้ปกครอง"?[
   ["home","🏠","หน้าแรก"],["status","📍","สถานะ"],["history","🕘","ประวัติ"]
 ]:[
   ["home","🏠","หน้าหลัก"],["trips","🏡","กลับบ้าน"],["leaves","📝","พัก/ลา"],["students","👥","นักเรียน"]
 ];
 return '<div class="nav"><div class="nav-in">'+items.map(x=>'<button class="'+(state.page===x[0]?"active":"")+'" onclick="route(\''+x[0]+'\')"><div style="font-size:18px">'+x[1]+'</div>'+x[2]+'</button>').join("")+'</div></div>'
}
async function queryAll(){
 const [st,tr,lr]=await Promise.all([
  sb.from("students").select("*").eq("active",true).order("level").order("room").order("student_code"),
  sb.from("home_trips").select("*,students(id,full_name,level,room,photo_path,student_number)").order("leave_at",{ascending:false}).limit(300),
  sb.from("leave_requests").select("*,students(id,full_name,level,room,photo_path,student_number)").order("created_at",{ascending:false}).limit(300)
 ]);
 if(st.error) throw st.error;if(tr.error) throw tr.error;if(lr.error) throw lr.error;
 state.cache={students:st.data||[],trips:tr.data||[],leaves:lr.data||[]}; return state.cache;
}
async function getStudentByCode(code){
 const {data,error}=await sb.from("students").select("*").eq("student_code",code).eq("active",true).maybeSingle(); if(error)throw error; return data;
}
async function getOpenTrip(studentId){
 const {data,error}=await sb.from("home_trips").select("*,students(id,full_name,level,room,photo_path,student_number)").eq("student_id",studentId).is("return_at",null).order("leave_at",{ascending:false}).limit(1).maybeSingle();
 if(error)throw error;
 return data;
}
function start(){
 state.role=null; state.page="home"; renderRole();
}
function renderRole(){
 $("app").innerHTML='<main class="main"><div class="login-box"><div class="center">'+logoHtml("logo")+"<h2 style='margin:12px 0 5px'>Homecoming</h2><p class='muted'>ระบบจัดการการกลับบ้าน การพัก/ลา และการกลับเข้าหอพักนักเรียน</p></div><div class='notice' style='margin:18px 0'>เลือกประเภทผู้ใช้งานเพื่อเข้าสู่เมนูที่เกี่ยวข้อง ระบบรุ่นนี้ยังไม่บังคับรหัสผ่าน</div><div class='grid' style='grid-template-columns:repeat(2,1fr)'>"+[
 ["นักเรียน","🎓","บันทึกกลับบ้าน / กลับเข้าหอ / แจ้งพัก-ลา"],
 ["ผู้ปกครอง","👨‍👩‍👧","ติดตามสถานะและประวัติของนักเรียน"],
 ["ครู","👩‍🏫","ตรวจสอบรายการ อนุมัติพัก-ลา และดูนักเรียน"],
 ["ผู้บริหาร","📊","ภาพรวมสถิติ รายงาน และข้อมูลทั้งระบบ"]
 ].map(x=>'<button class="role" onclick="chooseRole(\''+x[0]+'\')"><div class="ico">'+x[1]+'</div><strong>'+x[0]+'</strong><span>'+x[2]+'</span></button>').join("")+"</div><p class='muted center' style='margin-top:20px'>โรงเรียนห้องสอนศึกษา ในพระอุปถัมภ์ฯ</p></div></main>";
}
function chooseRole(role){
 state.role=role;
 state.student=null;
 if(role==="ผู้ปกครอง"){ renderIdentity(); }
 else { state.page="home"; render(); }
}
function renderIdentity(){
 $("app").innerHTML='<main class="main"><div class="login-box"><div class="student-head">'+logoHtml("student-avatar")+'<div><div class="muted">เข้าสู่ระบบแบบเลือกนักเรียน</div><div class="badge-big">'+esc(state.role)+'</div></div></div><div class="form" style="margin-top:18px"><label>รหัสนักเรียน</label><input id="identityCode" placeholder="เช่น STD-001" autocomplete="off"><button class="btn" onclick="identitySubmit()">เข้าสู่ระบบ</button><button class="btn light" onclick="start()">← เปลี่ยนประเภทผู้ใช้งาน</button></div><div class="notice" style="margin-top:14px">ใช้รหัสนักเรียนเพื่อเปิดข้อมูลของนักเรียนคนนั้น ระบบนี้เป็นเวอร์ชันใช้งานภายในและยังไม่ได้เปิด Auth/PIN</div></div></main>';
 $("identityCode").focus();
}
async function identitySubmit(){
 try{const s=await getStudentByCode($("identityCode").value.trim()); if(!s)return toast("ไม่พบรหัสนักเรียน",false); state.student=s; state.page="home"; render();}catch(e){toast("เชื่อมต่อข้อมูลไม่สำเร็จ: "+e.message,false)}
}
function goHome(){state.page="home";render()}
function exitRole(){closeModal();state.role=null;state.student=null;state.page="home";renderRole()}
async function render(){
 try{
  if(!state.cache.students.length) await queryAll();
  let title=state.role==="นักเรียน"?"Homecoming · นักเรียน":state.role==="ผู้ปกครอง"?"Homecoming · ผู้ปกครอง":"Homecoming · "+state.role;
  $("app").innerHTML=shell(title,"โรงเรียนห้องสอนศึกษา ในพระอุปถัมภ์ฯ");
  if(state.role==="นักเรียน") renderStudent(); else if(state.role==="ผู้ปกครอง") renderParent(); else renderStaff();
 }catch(e){$("app").innerHTML='<main class="main"><div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="render()">ลองใหม่</button></div></main>'}
}
function renderStudentPicker(){
 const students=state.cache.students;
 $("content").innerHTML='<div class="hero"><div class="hero-row"><div><p style="color:#dcfce7">โหมดนักเรียน</p><h2>แดชบอร์ดนักเรียน</h2><p>ไม่ต้องเข้าสู่ระบบ เลือกชื่อของตนเองเพื่อเริ่มใช้งาน</p></div><div class="pill p-blue">'+students.length+' คน</div></div></div><div class="section-title"><h3>เลือกข้อมูลนักเรียน</h3></div><div class="card"><div class="form two"><div style="grid-column:1/-1"><label>🔎 ค้นหาชื่อ</label><input id="studentPickerSearch" oninput="filterStudentPicker()" placeholder="พิมพ์ชื่อ-สกุล"></div><div><label>ชั้น</label><select id="studentLevelFilter" onchange="filterStudentPicker()"><option value="">ทุกชั้น</option>'+[...new Set(students.map(s=>s.level).filter(Boolean))].map(v=>'<option>'+esc(v)+'</option>').join("")+'</select></div><div><label>ห้อง</label><select id="studentRoomFilter" onchange="filterStudentPicker()"><option value="">ทุกห้อง</option>'+[...new Set(students.map(s=>s.room).filter(Boolean))].map(v=>'<option>'+esc(v)+'</option>').join("")+'</select></div><div><label>เลขที่</label><input id="studentNumberFilter" type="number" inputmode="numeric" min="1" oninput="filterStudentPicker()" placeholder="เช่น 12"></div><div><label>จำนวนที่พบ</label><div id="studentPickerCount" class="notice" style="min-height:44px;display:flex;align-items:center">-</div></div></div><div class="section-title"><h3>รายชื่อนักเรียน</h3></div><select id="studentPicker" size="8" style="min-height:270px;width:100%" onchange="selectStudentFromPicker()"></select><button class="btn" style="margin-top:14px;width:100%" onclick="confirmStudentPicker()">เข้าสู่แดชบอร์ดนักเรียน</button><div class="notice" style="margin-top:14px">ค้นหาได้จาก <b>ชื่อ · ชั้น · ห้อง · เลขที่</b> โดยไม่แสดงรหัส STD</div></div>';
 filterStudentPicker();
}
function filterStudentPicker(){
 const el=$("studentPicker"); if(!el)return;
 const q=($("studentPickerSearch")?.value||"").trim().toLowerCase();
 const lv=$("studentLevelFilter")?.value||"";
 const room=$("studentRoomFilter")?.value||"";
 const num=($("studentNumberFilter")?.value||"").trim();
 const rows=state.cache.students.filter(s=>{
  const text=(s.full_name||"").toLowerCase();

async function upload(file,bucket,prefix){
 if(!file)return null;
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase(); const path=prefix+"/"+crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"}); if(error)throw error; return path;
}
async function resizeProfileImage(file){
 if(!file||!file.type.startsWith("image/"))throw new Error("กรุณาเลือกไฟล์รูปภาพ");
 const maxBytes=900*1024;
 const maxSide=700;
 const blobToCanvas=()=>new Promise((resolve,reject)=>{
   const url=URL.createObjectURL(file);
   const img=new Image();
   img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
   img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("อ่านรูปภาพไม่สำเร็จ"))};
   img.src=url;
 });
 const img=await blobToCanvas();
 let scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
 let width=Math.max(1,Math.round(img.naturalWidth*scale));
 let height=Math.max(1,Math.round(img.naturalHeight*scale));
 for(let attempt=0;attempt<5;attempt++){
   const canvas=document.createElement("canvas"); canvas.width=width; canvas.height=height;
   const ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0,width,height);
   const quality=[0.82,0.74,0.66,0.58,0.50][attempt];
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
   if(blob&&blob.size<=maxBytes)return blob;
   width=Math.max(320,Math.round(width*0.82)); height=Math.max(320,Math.round(height*0.82));
 }
 throw new Error("รูปภาพมีขนาดใหญ่เกินไป กรุณาเลือกรูปอื่น");
}

function renderExecutive(){
 const st=state.cache.students,tr=state.cache.trips,lr=state.cache.leaves; const tp=tr.filter(x=>x.home_date===today()),out=tp.filter(x=>!x.return_at).length,ret=tp.filter(x=>x.return_at).length,p=lr.filter(x=>x.status==="รอตรวจสอบ").length;
 $("content").innerHTML='<div class="hero"><div class="hero-row"><div><p style="color:#dcfce7">ผู้บริหาร</p><h2>รายงานภาพรวม Homecoming</h2><p>ข้อมูลปัจจุบันจากฐานข้อมูล Supabase</p></div><button class="btn light" onclick="exportCSV()">⬇️ Export CSV</button></div></div><div class="section-title"><h3>สถิติ</h3></div><div class="grid cards"><div class="card stat"><div class="ico">👥</div><div><b>'+st.length+'</b><small>นักเรียน</small></div></div><div class="card stat"><div class="ico">🏡</div><div><b>'+tp.length+'</b><small>กลับบ้านวันนี้</small></div></div><div class="card stat"><div class="ico">✅</div><div><b>'+ret+'</b><small>กลับเข้าหอแล้ว</small></div></div><div class="card stat"><div class="ico">⚠️</div><div><b>'+out+'</b><small>ยังไม่กลับ</small></div></div></div><div class="section-title"><h3>คำขอพัก / ลา</h3></div><div class="card"><b style="font-size:30px">'+p+'</b><div class="muted">รอตรวจสอบ</div></div><div class="section-title"><h3>การทำงาน</h3></div><div class="grid quick"><button onclick="route(\'trips\')">🏡<b>รายการกลับบ้าน</b></button><button onclick="route(\'leaves\')">📝<b>คำขอพัก/ลา</b></button><button onclick="route(\'students\')">👥<b>ข้อมูลนักเรียน</b></button><button onclick="exportCSV()">📊<b>รายงาน CSV</b></button></div>';
}
function exportCSV(){
 const rows=[["วันที่","ชื่อ-สกุล","เลขที่","ชั้น","ห้อง","ออกจากหอ","กลับเข้าหอ","สถานะ","คนมาส่ง/ผู้รับ","เบอร์โทร","ความเกี่ยวข้อง"]];
 state.cache.trips.forEach(t=>rows.push([t.home_date,t.students?.full_name||"",t.students?.student_number??"",t.students?.level||"",t.students?.room||"",t.leave_at||"",t.return_at||"",t.return_at?"กลับแล้ว":"ยังไม่กลับ",t.sender_name||"",t.sender_phone||"",t.sender_relation||""]));
 const csv="\\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="homecoming-report-"+today()+".csv";a.click();URL.revokeObjectURL(a.href);toast("ส่งออกรายงานแล้ว");
}
function route(p){state.page=p;render()}
window.addEventListener("error",e=>console.error(e));
start();
</script>
</body>
</html>
